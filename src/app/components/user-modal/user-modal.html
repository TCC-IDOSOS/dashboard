<div class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col max-h-[90vh]">

    <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 shrink-0">
      <h2 class="text-xl font-bold text-gray-800">Novo Usuário</h2>
    </div>

    <div *ngIf="formErrorMessage" class="mx-6 mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm font-medium shrink-0">
      {{ formErrorMessage }}
    </div>

    <form [formGroup]="userForm" (ngSubmit)="salvar()" class="p-6 overflow-y-auto">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" tabindex="0">Nome Completo</label>
            <input type="text" formControlName="name"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Data de Nascimento</label>
            <input type="date" formControlName="birthDate"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">CPF</label>
            <input type="text" formControlName="cpf" placeholder="000.000.000-00"
              [class.bg-gray-200]="isEditing" [class.text-gray-500]="isEditing" [class.cursor-not-allowed]="isEditing"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
          </div>


          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Rua</label>
            <input type="text" formControlName="streetName"
              class="w-full border-gray-300 rounded-md shadow-sm bg-gray-200 text-gray-500 border p-2 cursor-not-allowed">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Bairro</label>
            <input type="text" formControlName="bairro"
              class="w-full border-gray-300 rounded-md shadow-sm bg-gray-200 text-gray-500 border p-2 cursor-not-allowed">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Cidade</label>
            <input type="text" formControlName="city"
              class="w-full border-gray-300 rounded-md shadow-sm bg-gray-200 text-gray-500 border p-2 cursor-not-allowed">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Quantidade de Quedas</label>
            <input type="number" formControlName="quantidadeQuedas"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Unidade de Saúde</label>
            <select formControlName="unidadeSaude"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
              <option value="" disabled selected>Selecione uma unidade...</option>
              <option *ngFor="let unidade of unidadesSaude" [value]="unidade">{{ unidade }}</option>
            </select>
          </div>
        </div>

        <div class="space-y-4">

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" tabindex="1">Gênero</label>
            <select formControlName="genre"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
              <option value="" disabled selected>Selecione um gênero</option>
              <option *ngFor="let genre of genres" [value]="genre">{{ genre }}</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
            <input type="email" formControlName="email" placeholder="@exemplo.com"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">CEP</label>
            <input type="text" formControlName="zipCode" placeholder="00000-000"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
          </div>



          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Número</label>
              <input type="text" formControlName="streetNumber"
                class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Bairro</label>
              <input type="text" formControlName="bairro"
                class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Complemento</label>
            <input type="text" formControlName="complement"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">UF</label>
            <input type="text" formControlName="state"
              class="w-full border-gray-300 rounded-md shadow-sm bg-gray-200 text-gray-500 border p-2 cursor-not-allowed">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Usuário</label>
            <select formControlName="profile"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
              <option value="" disabled selected>Selecione um tipo...</option>
              <option *ngFor="let tipo of tiposUsuario" [value]="tipo">{{ tipo }}</option>
            </select>
          </div>

          @if(!isEditing) {
<div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <input type="password" formControlName="password"
              class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2">
          </div>
          }

          
        </div>
      </div>

      <div class="mt-8 flex justify-end space-x-3 border-t border-gray-100 pt-4">
        <button type="button" (click)="cancelar()"
          class="px-6 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          Cancelar
        </button>
        <button type="submit"
          class="px-6 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-black hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black">
          Salvar
        </button>
      </div>

    </form>
  </div>
</div>
