<div class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative bg-white rounded-xl shadow-lg p-8 w-full max-w-3xl m-4">
      
      <h2 class="text-xl font-semibold text-gray-900 mb-6">Cadastrar Unidade de Saúde</h2>
  
      <form [formGroup]="unidadeForm" (ngSubmit)="salvar()">
        
        <div class="grid grid-cols-2 gap-4">
          
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome da Unidade de Saúde</label>
            <input type="text" formControlName="nome" class="w-full bg-gray-100 border-transparent rounded-lg px-4 py-2 text-sm focus:border-gray-300 focus:bg-white focus:ring-0">
          </div>
  
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Rua</label>
            <input type="text" formControlName="rua" class="w-full bg-gray-100 border-transparent rounded-lg px-4 py-2 text-sm focus:border-gray-300 focus:bg-white focus:ring-0">
          </div>
  
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Número</label>
            <input type="text" formControlName="numero" class="w-full bg-gray-100 border-transparent rounded-lg px-4 py-2 text-sm focus:border-gray-300 focus:bg-white focus:ring-0">
          </div>
  
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">CEP</label>
            <input type="text" formControlName="cep" class="w-full bg-gray-100 border-transparent rounded-lg px-4 py-2 text-sm focus:border-gray-300 focus:bg-white focus:ring-0">
          </div>
  
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Bairro</label>
            <input type="text" formControlName="bairro" class="w-full bg-gray-100 border-transparent rounded-lg px-4 py-2 text-sm focus:border-gray-300 focus:bg-white focus:ring-0">
          </div>
  
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Cidade</label>
            <input type="text" formControlName="cidade" class="w-full bg-gray-100 border-transparent rounded-lg px-4 py-2 text-sm focus:border-gray-300 focus:bg-white focus:ring-0">
          </div>
  
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">UF</label>
            <input type="text" formControlName="uf" class="w-full bg-gray-100 border-transparent rounded-lg px-4 py-2 text-sm focus:border-gray-300 focus:bg-white focus:ring-0">
          </div>
  
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">CNPJ</label>
            <input type="text" formControlName="cnpj" class="w-full bg-gray-100 border-transparent rounded-lg px-4 py-2 text-sm focus:border-gray-300 focus:bg-white focus:ring-0">
          </div>
  
        </div>
  
        <div class="mt-8 flex justify-end space-x-3">
          <button type="button" (click)="fechar.emit()" class="px-5 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
            Cancelar
          </button>
          <button type="submit" class="px-5 py-2 bg-black text-white rounded-lg text-sm font-medium flex items-center space-x-2 hover:bg-gray-800 transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
            <span>Salvar</span>
          </button>
        </div>
  
      </form>
    </div>
  </div>
