<div class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col">
    
    <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
      <h2 class="text-xl font-bold text-gray-800">Filtrar por Data</h2>
      <button (click)="fechar.emit()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="p-6 space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">A partir de (Data Início)</label>
        <input type="date" [ngModel]="dataInicio()" (ngModelChange)="dataInicio.set($event)" class="w-full border border-gray-300 rounded-md shadow-sm p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500 bg-white">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Até (Data Fim)</label>
        <input type="date" [ngModel]="dataFim()" (ngModelChange)="dataFim.set($event)" class="w-full border border-gray-300 rounded-md shadow-sm p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500 bg-white">
      </div>
      <p class="text-xs text-gray-500 leading-relaxed">
        Para filtrar um dia específico, preencha a mesma data nos dois campos ou apenas a Data Início.
      </p>
    </div>

    <div class="px-6 py-4 border-t border-gray-100 flex justify-end space-x-3 bg-gray-50">
      <button (click)="limpar()" class="px-4 py-2.5 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-100 transition-colors">Limpar</button>
      <button (click)="aplicarFiltro()" class="px-4 py-2.5 bg-black text-white rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">Aplicar Filtro</button>
    </div>
  </div>
</div>
