<div class="flex h-screen bg-white font-sans text-gray-800">

    <app-menu-lateral />
  
    <main class="flex-1 p-10 overflow-y-auto bg-white">
      
      <div class="flex justify-between items-start mb-8">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-1">Meu Perfil</h1>
          <p class="text-gray-500">Edite suas informações pessoais</p>
        </div>
        
        <button (click)="logout()" class="inline-flex items-center px-4 py-2 border border-red-200 text-sm font-medium rounded-lg text-red-600 bg-white hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors">
          <svg class="mr-2" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          Sair
        </button>
      </div>
  
      <div class="border border-gray-200 rounded-xl p-8 max-w-4xl">
        
        @if (formErrorMessage()) {
          <div class="mb-6 p-3 bg-red-100 text-red-700 rounded-lg text-sm font-medium">
            {{ formErrorMessage() }}
          </div>
        }
  
        <form [formGroup]="profileForm" (ngSubmit)="salvarAlteracoes()">
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
            
            <div class="space-y-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                <input type="text" formControlName="name" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2.5">
              </div>
  
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Data de Nascimento</label>
                <input type="date" formControlName="birthDate" class="w-full border-gray-300 rounded-md shadow-sm bg-gray-200 text-gray-500 border p-2.5 cursor-not-allowed">

              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cep</label>
                <input type="text" formControlName="zipCode" maxlength="9" placeholder="00000-000" (input)="aplicarMascaraCep($event)" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2.5">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Rua</label>
                <input type="text" formControlName="streetName" class="w-full border-gray-300 rounded-md shadow-sm bg-gray-200 text-gray-500 border p-2.5 cursor-not-allowed">
              </div>
  
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cidade</label>
                <input type="text" formControlName="city" class="w-full border-gray-300 rounded-md shadow-sm bg-gray-200 text-gray-500 border p-2.5 cursor-not-allowed">
              </div>
  
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Unidade de Saúde</label>
                <select formControlName="unidadeSaude" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2.5">
                  <option value="" disabled selected>Selecione uma unidade...</option>
                  @for (unidade of unidadesSaude; track unidade) {
                    <option [value]="unidade">{{ unidade }}</option>
                  }
                </select>
              </div>
            </div>
  
            <div class="space-y-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" formControlName="email" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2.5">
              </div>
  
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">CPF</label>
                <input type="text" formControlName="cpf" maxlength="14" placeholder="000.000.000-00" (input)="aplicarMascaraCpf($event)" class="w-full border-gray-300 rounded-md shadow-sm bg-gray-200 text-gray-500 border p-2.5 cursor-not-allowed">
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                <input type="text" formControlName="phone" maxlength="15" placeholder="(00) 00000-0000" (input)="aplicarMascaraTelefone($event)" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2.5">
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Número</label>
                  <input type="text" formControlName="streetNumber" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2.5">
                </div>
    
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Bairro</label>
                  <input type="text" formControlName="bairro" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2.5">
                </div>
              </div>
  
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">UF</label>
                <input type="text" formControlName="state" class="w-full border-gray-300 rounded-md shadow-sm bg-gray-200 text-gray-500 border p-2.5 cursor-not-allowed">
              </div>
  
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nova senha</label>
                <input type="password" formControlName="password" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border p-2.5">
              </div>
            </div>
          </div>
  
          <div class="mt-10 flex justify-end border-t border-gray-100 pt-6">
            <button type="submit" class="inline-flex items-center px-6 py-3 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-black hover:bg-gray-800 transition-colors">
              <svg class="mr-2" width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
              </svg>
              Salvar Alterações
            </button>
          </div>
  
        </form>
      </div>
    </main>
  </div>
