<div class="flex h-screen bg-gray-50 font-sans text-gray-800 overflow-hidden">

  <app-menu-lateral />

  <main class="flex-1 p-10 overflow-y-auto">
    
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-1">Geração de Relatórios</h1>
      <p class="text-gray-500">Configure os filtros e gere relatórios personalizados</p>
    </div>

    <div class="max-w-2xl mx-auto bg-white border border-gray-200 rounded-xl shadow-sm p-8 mt-4">
      
      <div class="flex items-center space-x-2 text-gray-700 font-semibold mb-6 border-b border-gray-100 pb-4">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z" />
        </svg>
        <span>Filtros do Relatório</span>
      </div>

      <div class="space-y-5">
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Data Inicial *</label>
          <input 
            type="date" 
            [ngModel]="dataInicial()"
            (ngModelChange)="dataInicial.set($event)"
            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-sm outline-none focus:border-gray-400 focus:bg-white transition-colors">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Data Final *</label>
          <input 
            type="date" 
            [ngModel]="dataFinal()"
            (ngModelChange)="dataFinal.set($event)"
            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-sm outline-none focus:border-gray-400 focus:bg-white transition-colors">
        </div>

        <div class="relative">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nome do Idoso</label>
          <input 
            type="text" 
            [ngModel]="nomeIdoso()"
            (ngModelChange)="nomeIdoso.set($event); mostrarDropdown.set(true)"
            (focus)="mostrarDropdown.set(true)"
            (blur)="esconderDropdownTimeout()"
            placeholder="Digite o nome do paciente"
            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-sm outline-none focus:border-gray-400 focus:bg-white transition-colors">
            
          @if (pacientesFiltrados().length > 0) {
            <ul class="absolute z-10 w-full bg-white border border-gray-200 rounded-md shadow-lg max-h-60 overflow-auto mt-1">
              @for (paciente of pacientesFiltrados(); track paciente.id) {
                <li 
                  (click)="selecionarPaciente(paciente.name)"
                  class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-sm text-gray-700 transition-colors">
                  {{ paciente.name }}
                </li>
              }
            </ul>
          }
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Unidade de Saúde</label>
          <select 
            [ngModel]="unidadeSaude()"
            (ngModelChange)="unidadeSaude.set($event)"
            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-sm outline-none focus:border-gray-400 focus:bg-white transition-colors appearance-none cursor-pointer">
            <option value="">Selecione a unidade</option>
            @for (unidade of unidadesDisponiveis(); track unidade) {
              <option [value]="unidade">{{ unidade }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Idade</label>
          <input 
            type="number" 
            [ngModel]="idade()"
            (ngModelChange)="idade.set($event)"
            placeholder="Ex: 65"
            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-sm outline-none focus:border-gray-400 focus:bg-white transition-colors">
        </div>

        <div class="pt-4">
          <button 
            (click)="gerarRelatorio()"
            [disabled]="isLoading()"
            class="w-full bg-[#111827] hover:bg-black text-white py-3 px-4 rounded-lg font-medium text-sm transition-colors flex items-center justify-center space-x-2 shadow-sm disabled:bg-gray-400 disabled:cursor-not-allowed">
            @if (isLoading()) {
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Processando...</span>
            } @else {
              <span>Gerar Relatório</span>
            }
          </button>
        </div>

      </div>

    </div>

  </main>
</div>
